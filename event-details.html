<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1">
        <meta name="description" content="View a volunteering opportunity and apply to take part.">
        <title>Opportunity | Volunteer Connect</title>
        <link rel="stylesheet" href="src/styles.css">
    </head>
    <body>
        <main class="page-shell">
            <section class="event-detail-shell">
                <a href="/events.html#upcoming-events" class="back-link"><span class="back-arrow">→</span> Upcoming opportunities</a>
                <p class="notice notice-info" role="status" aria-live="polite" data-event-detail-message>Loading opportunity…</p>
                <article class="event-detail" data-event-detail hidden>
                    <div class="event-detail-main">
                        <div class="event-detail-visual"><span class="event-category" data-event-category></span></div>
                        <span class="eyebrow" data-event-organisation></span>
                        <h1 data-event-title></h1>
                        <p class="event-detail-meta" data-event-meta></p>
                        <div class="detail-prose"><p data-event-description></p></div>
                        <section class="event-detail-requirements" data-event-requirements hidden>
                            <h2>Before you apply</h2>
                            <p data-event-eligibility></p>
                            <ul data-event-required-skills></ul>
                        </section>
                    </div>
                    <aside class="organisation-apply-panel">
                        <span class="eyebrow">Join the work</span>
                        <h2>Apply for this event</h2>
                        <p data-event-places></p>
                        <form data-event-detail-application>
                            <label for="event-application-message">Your message <span>(optional)</span></label>
                            <textarea id="event-application-message" name="application_message" maxlength="1000" rows="5" placeholder="Introduce yourself…"></textarea>
                            <button type="submit" class="button button-primary full-width">Apply to this event</button>
                        </form>
                    </aside>
                </article>
            </section>
        </main>
        <script type="module" src="/src/auth.js"></script>
        <script type="module" src="/src/event-details.js"></script>
    </body>
</html>
